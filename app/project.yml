name: LineWise
options:
  bundleIdPrefix: com.linewise
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  LineWise:
    type: application
    platform: iOS
    sources:
      - path: LineWise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linewise.app
        PRODUCT_NAME: LineWise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: LineWise/Info.plist
      properties:
        CFBundleDisplayName: 线感
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations: [zh_CN]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 拍一面墙，把你的线点亮。照片只保存在这台手机上。
        NSMicrophoneUsageDescription: 用语音记下一句话，识别在本机完成。
        NSSpeechRecognitionUsageDescription: 把你说的一句话转成文字，只用于填写记录。

  LineWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LineWiseTests
    dependencies:
      - target: LineWise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linewise.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LineWise:
    build:
      targets:
        LineWise: all
        LineWiseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LineWiseTests
